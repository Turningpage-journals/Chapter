<style>
/* Layout: one phone-width column, paper cards on a beige ground, fixed tab bar at the bottom. Look: cream paper, peach, dusty rose, sage and mustard gold, with small sparkles. */
:root{
  --bg:#E9DCCB; --paper:#FBF6EE; --ink:#4A3A30; --muted:#8C7A6B; --line:#E3D5C3;
  --acc:#BC8370; --acc-soft:#F4E2D7; --on-acc:#FFFAF6;
  --pist:#6B8268; --pist-soft:#E9E5D3;
  --butter:#A0793A; --butter-soft:#F3E4C8;
  --sky:#6E8486; --sky-soft:#E6E1D6;
  --rose:#B06A6E; --rose-soft:#F3DDD3;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --desk:#E9DCCB;
  --body:"Figtree", "Segoe UI", Helvetica, Arial, sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-accent="rosa"]{--acc:#B46F78;--acc-soft:#F3DDD5;--on-acc:#FFF8F8}
:root[data-accent="salvie"]{--acc:#647F69;--acc-soft:#E8E5D2;--on-acc:#F7FAF4}
:root[data-accent="nude"]{--acc:#A2847A;--acc-soft:#EFE4DD;--on-acc:#FFFAF8}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#141113; --paper:#231D20; --ink:#F5ECEE; --muted:#BBAAAF; --line:#44383C;
  --acc:#EBB8A4; --acc-soft:#4A3A33; --on-acc:#2A1912;
  --pist:#BCD0BE; --pist-soft:#333B36; --butter:#E6C9A0; --butter-soft:#463A35;
  --sky:#C3CDD0; --sky-soft:#363539; --rose:#EBB4BC; --rose-soft:#4A2F3E; color-scheme:dark }
 :root[data-accent="rosa"]:not([data-theme="light"]){--acc:#E3A9AF;--acc-soft:#4B3237;--on-acc:#26161A}
 :root[data-accent="salvie"]:not([data-theme="light"]){--acc:#B3C7B2;--acc-soft:#333B36;--on-acc:#141C15}
 :root[data-accent="nude"]:not([data-theme="light"]){--acc:#D9C1B7;--acc-soft:#463A3C;--on-acc:#221714}
}
:root[data-theme="dark"]{
  --bg:#141113; --paper:#231D20; --ink:#F5ECEE; --muted:#BBAAAF; --line:#44383C;
  --acc:#EBB8A4; --acc-soft:#4A3A33; --on-acc:#2A1912;
  --pist:#BCD0BE; --pist-soft:#333B36; --butter:#E6C9A0; --butter-soft:#463A35;
  --sky:#C3CDD0; --sky-soft:#363539; --rose:#EBB4BC; --rose-soft:#4A2F3E; color-scheme:dark }
:root[data-theme="dark"][data-accent="rosa"]{--acc:#E3A9AF;--acc-soft:#4B3237;--on-acc:#26161A}
:root[data-theme="dark"][data-accent="salvie"]{--acc:#B3C7B2;--acc-soft:#333B36;--on-acc:#141C15}
:root[data-theme="dark"][data-accent="nude"]{--acc:#D9C1B7;--acc-soft:#463A3C;--on-acc:#221714}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;padding-block:12px 110px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);border-radius:24px;padding:16px 14px 26px;box-shadow:0 1px 2px rgba(90,60,40,.08),0 10px 30px rgba(90,60,40,.08)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark svg{width:34px;height:34px}
.mark{flex:none;width:42px;height:42px;border-radius:13px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--display);font-size:24px;line-height:1}
.brand b{font-family:var(--display);font-weight:600;font-size:21px;display:block;line-height:1.05}
.brand small{color:var(--muted);font-size:13px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.icon-btn:disabled{opacity:.3;cursor:default}
.hero{margin:18px 0 6px;text-align:center}
.hero .eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.hero .eyebrow::before,.hero .eyebrow::after{content:"";width:32px;height:12px;background:radial-gradient(circle,var(--acc) 1.6px,transparent 2.2px),linear-gradient(var(--acc),var(--acc)) center/100% 1px no-repeat;opacity:.8}
.hero h1{font-family:var(--display);font-weight:500;font-size:38px;letter-spacing:0;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-family:var(--display);font-size:17px;font-weight:400}
.nav{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.nav .grow{flex:1;text-align:center;color:var(--muted);font-size:15px}
.link{background:none;border:none;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.line{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.45;margin:16px 8px 0;text-align:center}
.grid{display:grid;gap:14px;margin-top:18px}
.card{background:var(--c,var(--paper));border-radius:16px;padding:0;border:1px solid color-mix(in srgb,var(--d,var(--muted)) 40%,transparent);min-width:0;overflow:hidden}
.card > .bd{padding:14px 16px 16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sheet{box-shadow:none}}
:root[data-theme="dark"] .sheet{box-shadow:none}
.card h2{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;margin:0;padding:10px 14px 8px;border-bottom:1px solid color-mix(in srgb,var(--d,var(--muted)) 40%,transparent);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.3;color:var(--ink)}
.card h2::before,.card h2::after{content:"✦";font-size:11px;color:var(--d,var(--acc));opacity:.8;flex:none}
.card.solid h2{color:var(--on-acc);border-color:color-mix(in srgb,var(--on-acc) 30%,transparent)}
.card.solid h2::before,.card.solid h2::after{color:var(--on-acc)}
.c-acc{--c:var(--acc-soft);--d:var(--acc)} .c-pist{--c:var(--pist-soft);--d:var(--pist)} .c-butter{--c:var(--butter-soft);--d:var(--butter)}
.c-sky{--c:var(--sky-soft);--d:var(--sky)} .c-rose{--c:var(--rose-soft);--d:var(--rose)} .c-paper{--c:var(--paper);--d:var(--muted)}
.card.solid{--c:var(--acc);color:var(--on-acc);border:none}
.card.solid h2{color:var(--on-acc);opacity:.85}
.q{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px;font-size:16px}
.sp{margin-top:16px}
.q .v{font-family:var(--display);font-weight:500;color:var(--d);font-size:17px}
.dots{display:flex;gap:8px}
.dot{width:44px;height:44px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--d) 45%,transparent);background:var(--paper);padding:0;transition:background .2s,transform .2s,border-color .2s}
.dot.on{background:var(--d);border-color:var(--d)}
.dot:active{transform:scale(.94)}
.ends{display:flex;justify-content:space-between;width:252px;max-width:100%;font-size:13px;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid color-mix(in srgb,var(--d,var(--acc)) 40%,transparent);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 15px;min-height:40px;font-size:15px;transition:background .2s,color .2s}
.chip.on{background:var(--d,var(--acc));border-color:var(--d,var(--acc));color:var(--paper);font-weight:600}
input[type=text],input[type=number],select{width:100%;border:none;border-bottom:1.5px solid color-mix(in srgb,var(--d,var(--muted)) 45%,transparent);background:transparent;padding:9px 2px;font-family:var(--display);font-size:18px;letter-spacing:.005em;border-radius:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
input:focus,select:focus{outline:none;border-bottom-color:var(--d,var(--ink))}
textarea{display:block;width:100%;border:none;background:transparent;resize:vertical;font-family:var(--display);font-size:18px;line-height:36px;min-height:108px;padding:0 2px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,color-mix(in srgb,var(--d,var(--muted)) 35%,transparent) 35px 36px);background-attachment:local}
textarea:focus{outline:none}
textarea.tall{min-height:144px}
textarea{overflow:hidden}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.card.solid .hint{color:var(--on-acc);opacity:.8}
.three{display:grid;gap:4px}
.three label{display:flex;align-items:center;gap:10px}
.three label span{font-family:var(--display);color:var(--d);width:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:999px;border:1.5px solid var(--acc);background:var(--acc);color:var(--on-acc);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.light{background:transparent;color:var(--on-acc);border-color:color-mix(in srgb,var(--on-acc) 55%,transparent)}
.btn.danger{background:var(--rose);border-color:var(--rose);color:var(--paper)}
.btn.small{min-height:40px;padding:6px 16px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;min-height:42px;font-size:15px}
.seg button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.weekdots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.wd{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);min-width:36px;padding:4px 0}
.wd i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--acc);background:var(--paper)}
.wd.half i{background:linear-gradient(to top,var(--acc) 50%,var(--paper) 50%)}
.wd.full i{background:var(--acc)}
.wd.cur span{color:var(--ink);font-weight:700}
.wd:disabled{opacity:.35}
.look{font-family:var(--display);font-weight:500;font-size:23px;line-height:1.25;text-align:center;margin:0}
.center{text-align:center}
.closed-list{list-style:none;padding:0;margin:0}
.closed-list li{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--on-acc) 25%,transparent)}
.closed-list li:last-child{border:none}
.closed-list small{display:block;opacity:.75;font-size:13px}
.tracker{display:grid;grid-template-columns:minmax(84px,1.3fr) repeat(7,1fr);gap:7px 4px;align-items:center}
.tracker .h{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.tracker .rl{font-size:14px}
.cell{justify-self:center;width:26px;height:26px;border-radius:50%;border:1.3px solid var(--d);background:var(--paper);padding:0}
.insight{margin:0 0 10px}.insight:last-child{margin:0}
.insight::before{content:"✦ ";opacity:.8}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:10px;border-bottom:1px solid color-mix(in srgb,var(--d,var(--line)) 30%,transparent);min-height:48px;padding:4px 0}
.list li .t{flex:1;min-width:0;font-family:var(--display);font-size:17px}
.list li .t small{font-family:var(--body)}
.list li .t small{display:block;color:var(--muted);font-size:13px}
.list li.done .t b,.list li.done .t > span{text-decoration:line-through;color:var(--muted)}
.box{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--d);background:var(--paper);padding:0;display:grid;place-items:center}
.box.on{background:var(--d)}
.box.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.x{background:none;border:none;color:var(--muted);font-size:24px;width:40px;height:40px;line-height:1}
.add{display:flex;gap:8px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.add input,.add select{flex:1 1 120px;min-width:0}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--d)}
.sum{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:17px;margin-top:12px;font-variant-numeric:tabular-nums}
.goal{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--d) 30%,transparent)}
.goal:last-child{border:none}
.gname{font-family:var(--display);font-weight:500;font-size:17px}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:flex;gap:3px}
.score button{width:22px;height:22px;border-radius:5px;border:1.2px solid var(--d);background:var(--paper);padding:0;font-size:0}
.score button.on{background:var(--d)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bars{list-style:none;padding:0;margin:0}
.bars li{margin-bottom:10px}.bars li:last-child{margin:0}
.bars .lbl{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--paper);margin-top:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--d)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:color-mix(in srgb,var(--d) 18%,var(--paper));margin:12px 0 4px}
.stack i{display:block;height:100%}
.facts{list-style:none;padding:0;margin:6px 0 0}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--d) 25%,transparent);font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.facts li:last-child{border:none}
.facts li span:first-child{display:flex;align-items:center;gap:8px}
.facts small{color:var(--muted);font-family:var(--body);font-size:13px;margin-left:4px}
.facts .strong{font-weight:600}
.sw-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.restbig{text-align:center;padding:4px 0 2px}
.restbig small{display:block;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.restbig b{font-family:var(--display);font-weight:500;font-size:36px;color:var(--pist);font-variant-numeric:tabular-nums}
.restbig.neg b{color:var(--rose)}
.mnow .q{font-family:var(--display);font-size:17px}
.mnow{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--d) 25%,transparent)}
.tips{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--d) 25%,transparent)}
.brow{display:flex;gap:8px;align-items:flex-end}
.brow input[type=text]{flex:1 1 auto;min-width:0}
.brow .amt{flex:none;width:100px;text-align:right;font-variant-numeric:tabular-nums}
.blist li{min-height:44px;border-bottom:none;padding:0}
.brow .blab{flex:1 1 auto;min-width:0;font-family:var(--display);font-size:17px;padding-bottom:9px}
.brow select{flex:none;width:auto;max-width:62%}
.bd > .brow + .brow{margin-top:4px}
.challenge{display:flex;gap:12px;align-items:flex-start}
.challenge p{margin:0}
.foot{text-align:center;color:var(--muted);font-size:14px;margin:22px 8px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:10}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-auto-columns:1fr;grid-auto-flow:column}
nav.tabs button{border:none;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);min-height:60px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:576px;margin:0 auto;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--acc);color:var(--on-acc);border-radius:16px;padding:12px 14px 12px 18px;font-size:16px;z-index:40}
.upd.show{display:flex}
.upd button{flex:none;border:none;border-radius:999px;background:var(--on-acc);color:var(--acc);font-weight:700;padding:10px 18px;min-height:44px}
.modal{position:fixed;inset:0;background:rgba(30,20,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.modal .sheet{background:var(--paper);border-radius:22px;padding:22px 18px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto}
.modal h3{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;margin:0 0 6px;text-align:center;text-wrap:balance}
.modal .sh{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin:20px 0 6px;color:var(--acc)}
.modal textarea.plain{background-image:none;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;line-height:1.4;font-family:ui-monospace,Menlo,monospace;min-height:110px}
.modal p{text-align:center}
.modal .chips{justify-content:center}
.steps{display:flex;justify-content:center;gap:8px;margin:16px 0 0}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--acc)}
.swatches{display:flex;justify-content:center;gap:14px;margin-top:8px}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.howto{text-align:left;padding-left:22px;margin:6px 0 0}
.howto li{margin:4px 0}
.big-mark{width:96px;height:96px;border-radius:28px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;margin:4px auto 14px}
.big-mark svg{width:78px;height:78px}
@media (min-width:460px){.grid.two{grid-template-columns:1fr 1fr}.span{grid-column:1/-1}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="sheet">
  <header class="top">
    <div class="brand"><div class="mark" id="mark" aria-hidden="true"></div><div><b id="brand">Chapter</b><small>Your new chapter starts here</small></div></div>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="view"></main>
</div></div>
<nav class="tabs" aria-label="Main menu"><div class="in" id="tabs"></div></nav>
<div class="upd" id="upd" role="status"><span>A new version of Chapter is ready.</span><button type="button">Update</button></div>
<div class="toast" id="toast" role="status" aria-live="polite">Saved</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
const KEY="chapter.v1";
const MOVE_POOL=["Padel","Tennis","Golf","Yoga","Pilates","Running","Strength","Swimming","Cycling","Dance","Skiing","Football","Climbing","Walk in the park","Hike","Walked to work"];

/* Currency: picked from the phone's region, euro when the region is unknown; changeable at start, in Budget and in Settings */
const CURRENCIES=[["EUR","Euro"],["USD","US dollar"],["GBP","British pound"],["CAD","Canadian dollar"],["AUD","Australian dollar"],["NZD","New Zealand dollar"],["CHF","Swiss franc"],["NOK","Norwegian krone"],["SEK","Swedish krona"],["DKK","Danish krone"],["PLN","Polish złoty"],["ZAR","South African rand"],["SGD","Singapore dollar"],["INR","Indian rupee"],["JPY","Japanese yen"]];
/* Rough size of one US dollar in each currency, only used to scale the sample budget */
const FX={USD:1,EUR:0.92,GBP:0.79,CAD:1.37,AUD:1.52,NZD:1.66,CHF:0.88,NOK:10.8,SEK:10.6,DKK:6.9,PLN:4,ZAR:18.5,SGD:1.34,INR:83,JPY:150};
function guessCurrency(){
 const l=(navigator.language||"en-US").toUpperCase();const r=l.split("-")[1]||"";
 const map={US:"USD",GB:"GBP",UK:"GBP",IE:"EUR",CA:"CAD",AU:"AUD",NZ:"NZD",CH:"CHF",NO:"NOK",SE:"SEK",DK:"DKK",PL:"PLN",ZA:"ZAR",SG:"SGD",IN:"INR",JP:"JPY",DE:"EUR",FR:"EUR",ES:"EUR",IT:"EUR",NL:"EUR",BE:"EUR",AT:"EUR",FI:"EUR",PT:"EUR",GR:"EUR"};
 if(map[r])return map[r];if(l.startsWith("NB")||l.startsWith("NN")||l.startsWith("NO"))return "NOK";if(l.startsWith("SV"))return "SEK";if(l.startsWith("DA"))return "DKK";return "EUR";}
const LOCALE=(()=>{const l=navigator.language||"en-GB";return /^en/i.test(l)?l:"en-GB";})();

const blank=()=>({budget:null,miles:[],meta:{name:"",accent:"",currency:guessCurrency(),mods:{social:true,train:true,money:true,work:true,home:true},moves:["Yoga","Pilates","Running","Strength","Walk in the park","Walked to work"]},days:{},weeks:{},months:{},goals:{},wishes:[],home:[],finds:[]});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){S=blank();}
function normalize(){const b=blank();S=Object.assign(b,S);S.meta=Object.assign(b.meta,S.meta||{});S.meta.mods=Object.assign(blank().meta.mods,S.meta.mods||{});if(!Array.isArray(S.meta.moves))S.meta.moves=b.meta.moves;if(!Array.isArray(S.miles))S.miles=[];if(!S.meta.currency)S.meta.currency=guessCurrency();}
normalize();
let saveT,toastT;
function save(quiet){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} if(!quiet)toast("Saved");}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(),600);}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),1300);}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function weekNo(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7);}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtLong=d=>d.toLocaleDateString(LOCALE,{weekday:"long",day:"numeric",month:"long"});
const fmtShort=d=>d.toLocaleDateString(LOCALE,{day:"numeric",month:"short"});
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const fmtMonth=d=>d.toLocaleDateString(LOCALE,{month:"long",year:"numeric"});
const num=(n,d=1)=>n==null||isNaN(n)?"–":n.toFixed(d);
function money(n){const c=S.meta.currency||"EUR";try{return new Intl.NumberFormat(LOCALE,{style:"currency",currency:c,maximumFractionDigits:0,minimumFractionDigits:0}).format(Math.round(n||0));}catch(e){return Math.round(n||0)+" "+c;}}
const curLabel=()=>S.meta.currency||"EUR";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DN=["M","T","W","T","F","S","S"],DN2=["Mo","Tu","We","Th","Fr","Sa","Su"];
const nm=()=>(S.meta.name||"").trim();
const possessive=n=>/s$/i.test(n)?n+"’":n+"’s";
const M=()=>S.meta.mods;

const SCALES={
  mood:{q:"How is your mood?",l:["Heavy","Low","Okay","Good","Glowing"]},
  energy:{q:"How much energy do you have?",l:["Empty","Low","Medium","Good","Full speed"]},
  sleep:{q:"How did you sleep?",l:["Terrible","Poorly","Okay","Well","Like a log"]},
  work:{q:"How was your day at work or school?",l:["Hard","Slow","Fine","Good","Brilliant"]}
};
const SOCIAL=["Friends","Family","Colleagues","Date","Dinner at home","Dinner out","Night out","Alone"];
const FREE=["Slept in","Brunch","Outdoors","Workout","Friends","Family","Date","Sofa and series","Fixed things at home","Errands","Travel","Nothing, and it was lovely"];
const CARE=["Sofa and series","Cooked something good","Early night","Called family","Me time","Tidied at home","Creative project"];
const SPEND=["Bought nothing","Only planned","A little impulse","A lot of impulse"];
const AREAS=["Career and learning","Money","Home","Family","Friends","Love","Body and fitness","Calm and me time","Adventure and travel"];
const MILE_IDEAS=["My first own place","Emergency fund of three months’ costs","My first salary negotiation","Cook five dinners I’m proud of","Travel solo","Host a dinner for friends","Take a course I’ve dreamed of","Say no without feeling guilty"];
const HOMETYPE=["Must","Should","Dream"];
const ACCENTS=[["","Peach","#BC8370"],["rosa","Dusty rose","#B46F78"],["salvie","Sage","#647F69"],["nude","Nude","#A2847A"]];
const LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M14 64 C26 60 40 62 50 70 C60 62 74 60 86 64 L86 80 C74 76 60 78 50 86 C40 78 26 76 14 80 Z" fill="currentColor"/><path d="M50 70 L50 86" stroke="var(--acc)" stroke-width="2" fill="none"/><path d="M50 70 L50 48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/><path d="M50 50 C38 42 30 36 30 28 C30 22 35 18 40 18 C45 18 48 21 50 25 C52 21 55 18 60 18 C65 18 70 22 70 28 C70 36 62 42 50 50 Z" fill="#B5C7A8"/><path d="M50 48 L50 27" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
const MODS=[["social","Social life"],["train","Fitness"],["money","Money"],["work","Work and studies"],["home","Home"]];

const THEMES={
 0:["Money with meaning",["What did I spend the most on last year, and was it worth it?","What does financial freedom mean to me in five years?","Where do I buy joy, and where do I just buy habit?"],"30 days with no impulse clothes shopping. Write down everything you would have bought."],
 1:["Body and energy",["When do I feel strongest in my body?","Which kind of movement gives me the most energy?","How do I really sleep, and what affects it?"],"Three workouts a week, for four weeks."],
 2:["Career and ambition",["What at work or school makes me curious, and what bores me?","Who do I want to learn from?","Where do I want to be in three years, and what is the next step?"],"Book a coffee with someone you admire professionally."],
 3:["Friendship",["Which friendships give me the most, and do I nurture them enough?","Am I always the one who organises? What happens if someone else takes the lead?","Who have I lost touch with that I miss?"],"Send a message to someone you miss, for no reason."],
 4:["Outdoors and light",["What do I want to do more of when the days get longer?","Which new activity do I want to try this year?","How do I celebrate spring in a way that feels like me?"],"One weekend with no plans at all."],
 5:["Boundaries and me time",["When do I say yes when I mean no?","What do I need to recharge, and am I getting it?","What does a perfect sofa evening look like, without guilt?"],"Set aside one evening a week that is only yours."],
 6:["Travel and roots",["Where do I feel most free?","Which parts of my family history do I want to explore?","Which trips do I want to have taken before I turn 30?"],"Make a “30 before 30” list under Things I want to do."],
 7:["Nature and calm",["What happens in my head when I’m out in nature?","Who do I want to bring on a hike?","Which small rituals bring calm to my everyday life?"],"One long walk with friends, ending with food you make together."],
 8:["Fresh start",["What do I want to learn this autumn: a course, a language, a degree?","Which summer habits do I want to keep?","What am I proud of so far this year?"],"Sign up for one thing you have been putting off."],
 9:["Where I am, where I’m going",["Where am I now, and where do I want to be in a year?","What have I learned about myself this year?","What do I take with me, and what do I leave behind?"],"Write a letter to yourself to read in a year."],
 10:["At home",["What makes me feel at home, and what is missing?","Which three things do I want to fix first, and what can wait?","Which things around me show who I am?"],"Finish one corner of your home on a small budget."],
 11:["Family and traditions",["Which traditions do I want to bring into my own life?","Who gives me energy over the holidays, and who drains me?","What do I want to tell my family that I rarely say?"],"Host one small holiday dinner, with the budget set in advance."]
};

const U={view:"today",day:today(),week:monday(today()),month:new Date(today().getFullYear(),today().getMonth(),1),range:8,ob:{}};

const ICONS={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
 week:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 month:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 11l8-6.5 8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>',
 budget:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><circle cx="16" cy="13.5" r="1.3"/></svg>',
 overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 19h16"/><path d="M4 15l5-5 4 3 7-7"/></svg>'
};
const tabs=()=>[["today","Today"],["week","Week"],["month","Month"]].concat(M().home?[["home","Home"]]:[]).concat(M().money?[["budget","Budget"]]:[]).concat([["overview","Patterns"]]);
const chev=dir=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="${dir<0?"M15 5l-7 7 7 7":"M9 5l7 7-7 7"}"/></svg>`;
const card=(c,t,inner,cls="")=>`<section class="card c-${c} ${cls}">${t?`<h2>${t}</h2>`:""}<div class="bd">${inner}</div></section>`;
const hero=(eb,h,p)=>`<div class="hero"><div class="eyebrow">${eb}</div><h1>${h}</h1>${p?`<p>${p}</p>`:""}</div>`;

function applyMeta(){
 const a=S.meta.accent;if(a)document.documentElement.setAttribute("data-accent",a);else document.documentElement.removeAttribute("data-accent");
 const n=nm();document.getElementById("brand").textContent=n?possessive(n)+" chapter":"Chapter";
 const mk=document.getElementById("mark");if(!mk.firstChild)mk.innerHTML=LOGO;
 document.title=n?possessive(n)+" chapter":"Chapter";
 const col=(ACCENTS.find(x=>x[0]===a)||ACCENTS[0])[2];const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content=col;
}
function renderTabs(){const t=tabs();if(!t.some(x=>x[0]===U.view))U.view="today";document.getElementById("tabs").innerHTML=t.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${U.view===k?"on":""}" ${U.view===k?'aria-current="page"':""}>${ICONS[k]}<span>${l}</span></button>`).join("");}
function grow(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}
function growAll(){document.querySelectorAll("#view textarea").forEach(grow);}
function render(){applyMeta();renderTabs();document.getElementById("view").innerHTML=({today:vToday,week:vWeek,month:vMonth,home:vHome,budget:vBudget,overview:vOverview})[U.view]();if(U.view==="overview")drawChart();growAll();}

/* ---------- TODAY ---------- */
const dayData=k=>S.days[k]||(S.days[k]={});
const filled=x=>!!(x&&Object.keys(x).some(f=>{const v=x[f];return v!==undefined&&v!==""&&!(Array.isArray(v)&&!v.length);}));
function scale(f,val){const s=SCALES[f];
 return `<p class="q"><span>${s.q}</span><span class="v">${val?s.l[val-1]:""}</span></p>
 <div class="dots" role="group" aria-label="${s.q}">${[1,2,3,4,5].map(i=>`<button class="dot ${val&&i<=val?"on":""}" data-act="rate" data-f="${f}" data-v="${i}" aria-pressed="${val===i}" aria-label="${s.l[i-1]}"></button>`).join("")}</div>
 <div class="ends"><span>${s.l[0]}</span><span>${s.l[4]}</span></div>`;}
const chips=(f,labels,arr)=>`<div class="chips">${labels.map(s=>{const on=(arr||[]).includes(s);return `<button class="chip ${on?"on":""}" data-act="multi" data-f="${f}" data-v="${esc(s)}" aria-pressed="${on}">${esc(s)}</button>`;}).join("")}</div>`;
const pick=(f,labels,val)=>`<div class="chips">${labels.map((l,i)=>`<button class="chip ${val===i?"on":""}" data-act="pick" data-f="${f}" data-v="${i}" aria-pressed="${val===i}">${l}</button>`).join("")}</div>`;
const AM=["Good morning%n. What is today about?","A new day. You set the pace.","One intention is enough. The rest will follow.","Coffee first, then a few taps."];
const PM=["The day is almost over. Be honest, and kind to yourself.","Five minutes for you before bed.","What gave you energy today, and what took it?","Not everything needs a score. Some things just need to be noticed."];
const CLOSE=["Today is taken care of. Sleep well.","Closed and saved. The rest can wait until tomorrow.","Lovely that you paused.","The day was yours. It still is."];
const seed=k=>k.split("-").reduce((a,b)=>a*31+ +b,7);
const lineFor=(arr,k)=>arr[seed(k)%arr.length].replace("%n",nm()?", "+esc(nm()):"");
function lookFor(k){const d=S.days[k]||{},p=S.days[iso(addDays(parse(k),-1))]||{};return d.look!==undefined?d.look:(p.next||"");}
function weekDots(){const m=monday(U.day),k=iso(U.day);let h="";
 for(let i=0;i<7;i++){const dt=addDays(m,i),dk=iso(dt),x=S.days[dk],fut=dt>today();const st=x&&x.closed?"full":filled(x)?"half":"";
 h+=`<button class="wd ${st} ${dk===k?"cur":""}" data-act="goday" data-v="${dk}" ${fut?"disabled":""} aria-label="${fmtShort(dt)}"><i></i><span>${DN2[i]}</span></button>`;}
 return `<div class="weekdots">${h}</div>`;}
function vToday(){
 const k=iso(U.day),d=S.days[k]||{},isToday=k===iso(today());
 const part=U.part||(isToday&&new Date().getHours()<12&&!d.closed?"am":"pm");
 let last7=0;for(let i=0;i<7;i++)if(filled(S.days[iso(addDays(today(),-i))]))last7++;
 const greet=isToday?(part==="am"?"Good morning":"Good evening")+(nm()?", "+esc(nm()):""):"Looking back";
 let h=hero("Daily log",greet,fmtLong(U.day))+
 `<div class="nav"><button class="icon-btn" data-act="day" data-v="-1" aria-label="Previous day">${chev(-1)}</button>
 <span class="grow">${isToday?"Five minutes a day":`<button class="link" data-act="gotoday">Back to today</button>`}</span>
 <button class="icon-btn" data-act="day" data-v="1" aria-label="Next day" ${isToday?"disabled":""}>${chev(1)}</button></div>
 ${weekDots()}
 <div class="seg" role="group" aria-label="Morning or evening"><button class="${part==="am"?"on":""}" data-act="part" data-v="am">Morning</button><button class="${part==="pm"?"on":""}" data-act="part" data-v="pm">Evening${d.closed?" ✓":""}</button></div>`;
 if(part==="am"){
  const fromY=d.look===undefined&&lookFor(k);
  h+=`<p class="line">${lineFor(AM,k)}</p><div class="grid">
  ${card("sky","Sleep",scale("sleep",d.sleep))}
  ${card("acc","Today’s intention",`<input type="text" id="in-intent" data-bind="${k}|intent" value="${esc(d.intent)}" placeholder="Today I want to …" aria-label="Today’s intention"><p class="hint">For example: be present, say no once, walk to work.</p>`)}
  ${card("butter","Today I’m looking forward to",`<input type="text" id="in-look" data-bind="${k}|look" value="${esc(lookFor(k))}" placeholder="A lunch, a class, a phone call …" aria-label="Today I’m looking forward to">${fromY?`<p class="hint">You wrote this last night.</p>`:""}`)}
  ${card("pist","Three things I’m grateful for",`<div class="three">${[1,2,3].map(i=>`<label><span>${i}</span><input type="text" id="in-g${i}" data-bind="${k}|g${i}" value="${esc(d["g"+i])}" aria-label="Grateful for ${i}"></label>`).join("")}</div>`)}
  </div><div class="row"><button class="btn" data-act="amdone">Done for now</button></div><p class="foot">Mornings are optional. Everything can wait until tonight.</p>`;
  return h;
 }
 h+=`<p class="line">${lineFor(PM,k)}</p><div class="grid">`;
 const look=lookFor(k);
 if(look)h+=card("butter","What you were looking forward to",`<p class="look">${esc(look)}</p><p class="q" style="justify-content:center;margin-top:12px"><span>Did it happen?</span></p><div class="seg" style="margin-top:4px">${["Yes","Partly","No"].map((l,i)=>`<button class="${d.lookRes===i+1?"on":""}" data-act="lookres" data-v="${i+1}">${l}</button>`).join("")}</div>${d.lookRes===3?`<p class="hint center">Plans move. That says something about the day, not about you.</p>`:""}`);
 h+=card("acc","Mood and energy",scale("mood",d.mood)+`<div class="sp"></div>`+scale("energy",d.energy));
 if(!d.sleep)h+=card("sky","Sleep last night",scale("sleep",d.sleep));
 if(M().work){const wkend=[0,6].includes(U.day.getDay()),off=d.off!==undefined?d.off:wkend;
  h+=off?card("sky",wkend?"Weekend and time off":"Day off",`<p class="q"><span>How did you spend your day off?</span></p>${chips("free",FREE,d.free)}<p class="hint">Rest is progress too. It makes the rest of the week easier.</p><button class="link" data-act="offtoggle" style="margin-top:6px">I worked or studied anyway</button>`)
  :card("sky","Work and studies",scale("work",d.work)+`<input type="text" id="in-win" style="margin-top:12px" data-bind="${k}|win" value="${esc(d.win)}" placeholder="Something I got done today" aria-label="Something I got done today"><button class="link" data-act="offtoggle" style="margin-top:8px">${wkend?"Weekend, didn’t work":"Day off, didn’t work"}</button>`);}
 if(M().social)h+=card("rose","Who was I with?",chips("social",SOCIAL,d.social)+`<input type="text" id="in-people" style="margin-top:10px" data-bind="${k}|people" value="${esc(d.people)}" placeholder="Names, or what you did" aria-label="Who were you with">`);
 if(M().train)h+=card("pist","Movement",chips("move",S.meta.moves,d.move)+`<p class="hint">Change your activities in Settings.</p>`);
 h+=card("sky","Self-care",chips("care",CARE,d.care));
 if(M().money)h+=card("butter","Money today",pick("spend",SPEND,d.spend)+`<input type="number" inputmode="decimal" id="in-amt" style="margin-top:10px" data-bind="${k}|amt" value="${esc(d.amt)}" placeholder="Spent outside regular bills (${curLabel()})" aria-label="Spent today in ${curLabel()}"><p class="hint">Not to judge yourself. Just to see patterns.</p>`);
 h+=`${card("acc","The best part of today",`<input type="text" id="in-best" data-bind="${k}|best" value="${esc(d.best)}" placeholder="Big or small, it counts the same" aria-label="The best part of today">`)}
 ${card("paper","Reflection",`<textarea id="in-note" data-bind="${k}|note" placeholder="What did I learn today? What drained me?" aria-label="Reflection">${esc(d.note)}</textarea>`)}
 ${card("pist","Tomorrow I’m looking forward to",`<input type="text" id="in-next" data-bind="${k}|next" value="${esc(d.next)}" placeholder="Coffee in the sun, a dinner …" aria-label="Tomorrow I’m looking forward to"><p class="hint">Tomorrow evening the app will ask if it happened.</p>`)}
 </div>`;
 if(d.closed){const rows=[];if(d.intent)rows.push(["Intention",d.intent]);if(d.best)rows.push(["The best part",d.best]);if(d.next)rows.push(["Tomorrow",d.next]);
  h+=`<div class="grid">${card("acc","Day closed",`<p class="look" style="text-align:left;font-size:21px;margin-bottom:8px">${lineFor(CLOSE,k)}</p>${rows.length?`<ul class="closed-list">${rows.map(([a,b])=>`<li><small>${a}</small>${esc(b)}</li>`).join("")}</ul>`:""}<div class="row"><button class="btn light" data-act="reopen">Reopen the day</button></div>`,"solid")}</div>`;}
 else h+=`<div class="row"><button class="btn" data-act="closeday">Close the day</button></div>`;
 h+=`<p class="foot">${last7} of the last 7 days filled in. Everything is stored only on this device.</p>`;
 return h;
}

/* ---------- WEEK ---------- */
const daysIn=(start,n)=>Array.from({length:n},(_,i)=>{const dt=addDays(start,i);return{dt,k:iso(dt),d:S.days[iso(dt)]};});
const avg=(arr,f)=>{const v=arr.map(x=>x.d&&x.d[f]).filter(x=>typeof x==="number"&&x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
const cnt=x=>(x.d&&x.d.move||[]).length;
const soc=x=>(x.d&&x.d.social||[]).filter(s=>s!=="Alone").length;
function vWeek(){
 const ws=U.week,wk=iso(ws),w=S.weeks[wk]||{},days=daysIn(ws,7),isCur=wk===iso(monday(today()));
 const lvl=(v,max)=>`color-mix(in srgb,var(--d) ${Math.round(25+75*Math.min(v,max)/max)}%,var(--paper))`;

const BG=[["fixed","Bills and fixed costs","rose","What leaves your account every month"],["debt","Debt payments","sky","Pay at least the minimum, more on the most expensive"],["vary","Everyday spending","butter","What you control yourself"],["save","Saving","pist","Pay yourself first"]];

 const t=today(),y=t.getFullYear(),mo=t.getMonth(),dim=new Date(y,mo+1,0).getDate(),left=dim-t.getDate()+1;
 let spent=0;for(let d=1;d<=t.getDate();d++){const x=S.days[iso(new Date(y,mo,d))];if(x)spent+=+x.amt||0;}
 const seg=(val,c)=>val>0&&inc?`<i style="width:${Math.min(100,val/inc*100)}%;background:var(--${c})"></i>`:"";

 <ul class="facts">${line("Take-home pay per month",inc,"",true)}${line("Bills and fixed costs",f,"rose")}${db?line("Debt payments",db,"sky"):""}${line("Everyday spending",v,"butter")}${line("Saving",sv,"pist")}</ul>`;
 if(B.freq&&B.freq!=="monthly"&&+B.income)h+=`<p class="hint">Pay of ${money(+B.income)} ${(FREQ.find(x=>x[0]===B.freq)||FREQ[0])[1].toLowerCase()} is about ${money((+B.income)*freqF())} a month.</p>`;
 if(v){const lft=v-spent;h+=`<div class="mnow"><p class="q" style="margin:0 0 6px"><span>${t.toLocaleDateString(LOCALE,{month:"long"})} so far</span><span class="v">${money(spent)} of ${money(v)}</span></p><div class="bar"><b style="width:${Math.min(100,spent/v*100)}%;background:${spent>v?"var(--rose)":"var(--butter)"}"></b></div><p class="hint">${lft>=0?`${money(lft)} left of your everyday spending, about ${money(lft/left)} a day for the next ${left} days.`:`You are ${money(-lft)} over your everyday budget this month.`} Taken from “Money today” in your evening log.</p></div>`;}

 if(!inc)tips.push("Add what you are paid, and everything else is calculated for you.");

function vOverview(){
 const all=daysIn(addDays(today(),-(U.range*7-1)),U.range*7),regs=all.filter(x=>filled(x.d));
 const seg=`<div class="seg">${[4,8,12].map(n=>`<button class="${U.range===n?"on":""}" data-act="range" data-v="${n}">${n} weeks</button>`).join("")}</div>`;
 if(regs.length<3)return hero("Over time","Patterns","Charts appear once you have filled in a few days")+`<div class="grid">${card("butter","Want to see an example?",`<p style="margin:0">Fill in <b>Today</b> for a few evenings, or see what it looks like with three months of sample data.</p><div class="row"><button class="btn" data-act="demo">Show sample data</button></div><p class="hint center">You can delete the sample data in Settings.</p>`)}</div>`;
 const tally=(f,list)=>{const c={};regs.forEach(x=>(x.d[f]||[]).forEach(s=>c[s]=(c[s]||0)+1));return list.map(s=>[s,c[s]||0]).filter(r=>r[1]).sort((a,b)=>b[1]-a[1]).slice(0,6);};
 const bars=rows=>rows.length?`<ul class="bars">${rows.map(([s,c])=>`<li><div class="lbl"><span>${esc(s)}</span><span style="color:var(--muted)">${c} of ${regs.length} days</span></div><div class="bar"><b style="width:${Math.round(c/regs.length*100)}%"></b></div></li>`).join("")}</ul>`:`<p class="hint" style="margin:0">Nothing logged yet.</p>`;
 const sp=regs.filter(x=>typeof x.d.spend==="number"),imp=sp.filter(x=>x.d.spend>=2).length;
 return hero("Over time","Patterns",regs.length+" days filled in")+seg+`<div class="grid">
 ${card("paper","Week by week",`<svg class="chart" id="lineChart" viewBox="0 0 340 180" role="img" aria-label="Mood, energy and sleep per week"></svg><div class="legend"><span><i style="background:var(--acc)"></i>Mood</span><span><i style="background:var(--butter)"></i>Energy</span><span><i style="background:var(--sky)"></i>Sleep</span></div><p class="hint">Weekly average, from 1 to 5.</p>`)}
 ${card("acc","What your data shows",insights(all,4,false),"solid")}
 ${M().train?card("pist","Movement",bars(tally("move",S.meta.moves))):""}
 ${M().social?card("rose","Social life",bars(tally("social",SOCIAL))):""}
 ${M().work&&regs.some(x=>(x.d.free||[]).length)?card("sky","Your days off",bars(tally("free",FREE))):""}
 ${M().money?card("butter","Money",`<p style="margin:0">Impulse buys on <b>${imp}</b> of ${sp.length} logged days. Spent outside regular bills: <b>${money(regs.reduce((a,x)=>a+(+x.d.amt||0),0))}</b>.</p>`):""}
 </div>`;
}
function drawChart(){const el=document.getElementById("lineChart");if(!el)return;
 const ws=Array.from({length:U.range},(_,i)=>addDays(monday(today()),-7*(U.range-1-i)));
 const data=ws.map(w=>{const d=daysIn(w,7);return{w,mood:avg(d,"mood"),energy:avg(d,"energy"),sleep:avg(d,"sleep")};});
 const W=340,L=24,R=10,T=10,B=26,H=180,xs=i=>L+(ws.length===1?0:i*(W-L-R)/(ws.length-1)),ys=v=>T+(5-v)*(H-T-B)/4,step=Math.ceil(ws.length/6);
 let g="";[1,2,3,4,5].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;});
 ws.forEach((w,i)=>{if(i%step===0||i===ws.length-1)g+=`<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">w${weekNo(w)}</text>`;});
 [["mood","var(--acc)"],["energy","var(--butter)"],["sleep","var(--sky)"]].forEach(([f,c])=>{let seg=[],segs=[];data.forEach((p,i)=>{if(p[f]!=null)seg.push([xs(i),ys(p[f])]);else{if(seg.length)segs.push(seg);seg=[];}});if(seg.length)segs.push(seg);
  segs.forEach(s=>{g+=`<polyline points="${s.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;s.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="var(--paper)" stroke="${c}" stroke-width="1.8"/>`);});});
 el.innerHTML=g;}

function demo(){
 let sd=11;const r=()=>{sd=(sd*16807)%2147483647;return(sd-1)/2147483646;};const cl=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));
 const keep=S.meta;const nd=blank();nd.meta=keep;const mv=keep.moves.length?keep.moves:blank().meta.moves;

 for(let i=83;i>=1;i--){const dt=addDays(today(),-i),wd=(dt.getDay()+6)%7;if(r()<.12)continue;

  const mood=cl(2.2+(social.some(s=>s!=="Alone")?.9:0)+sleep*.2+(r()-.5)*1.4,1,5);const spend=energy<=2&&r()<.6?cl(2+r(),2,3):cl(r()*2.2,0,2);
  const d={sleep,energy,mood,move:[...new Set(move)],social,spend,amt:String(Math.round((spend*30+r()*25)*f))};

  const care=[];if(r()<.35)care.push("Sofa and series");if(r()<.3)care.push("Cooked something good");if(r()<.2)care.push("Called family");if(care.length)d.care=care;
  if(r()<.4)d.best=["Workout with the girls","Dinner with family","Found a lamp at a flea market","Lunch in the sun","Long call with a friend","Walk in the woods","Praise at work"][Math.floor(r()*7)];
  if(r()<.5)d.intent=["Be present","Walk to work","Say no once","Early night"][Math.floor(r()*4)];
  d.closed=true;nd.days[iso(dt)]=d;}
 const m0=monday(today());nd.weeks[iso(addDays(m0,-7))]={high:"Dinner at home for four. It worked!",hard:"Too many late nights in a row.",see:"Family, and the gym crew.",money:"Too much on takeaway."};
 const rr=v=>Math.round(v*f);

document.addEventListener("change",e=>{
 if(e.target.id==="impFile"&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);}
 if(e.target.dataset&&e.target.dataset.cur){S.meta.currency=e.target.value;save(true);render();if(document.getElementById("modal").classList.contains("open"))refreshModal();toast("Currency: "+e.target.value);}
 if(e.target.id==="b-freq"||e.target.id==="b-fundm")render();});
function bind(e){const el=e.target;if(!el.dataset||!el.dataset.bind)return;const p=el.dataset.bind.split("|");
 if(p[0]==="W"){S.weeks[p[1]]=S.weeks[p[1]]||{};S.weeks[p[1]][p[2]]=el.value;}
 else if(p[0]==="M"){S.months[p[1]]=S.months[p[1]]||{};S.months[p[1]][p[2]]=el.value;}
 else if(p[0]==="G"){S.goals[p[1]]=S.goals[p[1]]||{};S.goals[p[1]].t=el.value;}
 else if(p[0]==="R"){S[p[2]]=el.value;}
 else if(p[0]==="N"){S.meta.name=el.value;applyMeta();}
 else if(p[0]==="B"){if(!S.budget)S.budget=BDEF();if(p.length===2)S.budget[p[1]]=el.value;else{const r=S.budget[p[1]][+p[2]];if(r)r[p[3]]=el.value;}refreshBudget();}
 else{dayData(p[0])[p[1]]=el.value;}
 saveSoon();}
document.addEventListener("input",bind);
document.addEventListener("change",e=>{if(e.target.tagName==="SELECT")bind(e);});
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA"&&!e.target.classList.contains("plain"))grow(e.target);});
window.addEventListener("resize",growAll);
try{const t=localStorage.getItem(KEY+".theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);}catch(e){}

/* Update check: looks for a newer version where the app is hosted, without touching data */
const MY_VER=(document.querySelector('meta[name="app-version"]')||{}).content||"";
let updShown=false;
function checkUpdate(){if(updShown||!/^https?:/.test(location.protocol)||!window.fetch)return;
 fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{const m=t.match(/<meta name="app-version" content="([^"]+)"/);
  if(m&&m[1]&&m[1]!==MY_VER){updShown=true;const el=document.getElementById("upd");el.dataset.v=m[1];el.classList.add("show");}}).catch(()=>{});}
document.getElementById("upd").addEventListener("click",e=>{if(!e.target.closest("button"))return;save(true);location.replace(location.pathname+"?v="+encodeURIComponent(document.getElementById("upd").dataset.v||Date.now()));});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate();});
setTimeout(checkUpdate,1500);

render();
if(!S.meta.welcomed)welcome(0);
})();
</script>
</body>
</html>
